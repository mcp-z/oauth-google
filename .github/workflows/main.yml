name: CI
on:
  push:
    branches: [master]

jobs:
  ubuntu:
    name: Ubuntu
    if: github.ref == 'refs/heads/master'
    uses: ./.github/workflows/live.yml
    with:
      runner: ubuntu-latest
    secrets: &live-secrets
      CI_SECRETS_TOKEN: ${{ secrets.CI_SECRETS_TOKEN }}
      TEST_ACCOUNT_ID: ${{ secrets.TEST_ACCOUNT_ID }}
      TEST_REFRESH_TOKEN: ${{ secrets.TEST_REFRESH_TOKEN }}
      TEST_SCOPE: ${{ secrets.TEST_SCOPE }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      TEST_DCR_REFRESH_TOKEN: ${{ secrets.TEST_DCR_REFRESH_TOKEN }}
      TEST_DCR_SCOPE: ${{ secrets.TEST_DCR_SCOPE }}
      GOOGLE_TEST_DCR_CLIENT_ID: ${{ secrets.GOOGLE_TEST_DCR_CLIENT_ID }}
      GOOGLE_TEST_DCR_CLIENT_SECRET: ${{ secrets.GOOGLE_TEST_DCR_CLIENT_SECRET }}
      TEST_DCR_CLIENT_ID: ${{ secrets.TEST_DCR_CLIENT_ID }}
      TEST_DCR_CLIENT_SECRET: ${{ secrets.TEST_DCR_CLIENT_SECRET }}
      GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}
      GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY_ID: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY_ID }}
      GOOGLE_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_CLIENT_EMAIL }}
      GOOGLE_SERVICE_ACCOUNT_CLIENT_ID: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_CLIENT_ID }}
      GOOGLE_SERVICE_ACCOUNT_PROJECT_ID: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PROJECT_ID }}
      GOOGLE_SERVICE_ACCOUNT_AUTH_URI: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_AUTH_URI }}
      GOOGLE_SERVICE_ACCOUNT_TOKEN_URI: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_TOKEN_URI }}

  windows:
    name: Windows
    needs: ubuntu
    uses: ./.github/workflows/live.yml
    with:
      runner: windows-latest
    secrets: *live-secrets
